name: Update regional schedules
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-regional-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The operator may refuse GitHub's runners (HTTP 403); the primary collector runs in Ukraine.
      - run: python3 collect.py
        continue-on-error: true
      - name: Publish changed schedules
        if: always() && !cancelled()
        run: |
          git add -- data/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update regional schedules'
            git pull --rebase
            git push
          fi
